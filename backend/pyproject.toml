[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "statement-analyser"
version = "1.1.0"
description = "Bank statement extraction, categorization, merchant identification and reconciliation as a module."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "python-multipart>=0.0.9",
  "pydantic>=2.7,<3",
  "pymupdf>=1.24",
  "pillow>=10.3",
  "numpy>=1.26",
  "httpx>=0.27",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.10", "rapidocr-onnxruntime>=1.2.3"]
server = ["uvicorn[standard]>=0.30"]

[tool.setuptools.packages.find]
include = ["statement_analyser*"]
